services:
  - type: web
    name: green-tube-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: green-tube-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greentube-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: worker
    name: green-tube-worker
    runtime: python
    rootDir: services/ingestion
    buildCommand: pip install -r requirements.txt
    startCommand: python -m workers.musicbrainz_sync
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greentube-db
          property: connectionString

databases:
  - name: greentube-db
    plan: free
